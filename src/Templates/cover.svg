<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{ c1 }}"/>
      <stop offset="1" stop-color="{{ c2 }}"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" fill="url(#g)"/>
  <circle cx="230" cy="90" r="90" fill="#fff" opacity=".12"/>
  <circle cx="60" cy="330" r="110" fill="#000" opacity=".15"/>
  <rect width="300" height="34" fill="#4dc4ff"/>
  <text x="150" y="23" text-anchor="middle" font-family="Arial" font-weight="700"
        font-size="15" fill="#0b2a00" letter-spacing="4">LIBRO</text>
  {% for line in lines %}
  <text x="150" y="{{ 190 + loop.index0 * 34 }}" text-anchor="middle" font-family="Arial"
        font-weight="700" font-size="30" fill="#fff">{{ line }}</text>
  {% endfor %}
</svg>