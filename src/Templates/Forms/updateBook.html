<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
    <title>Document</title>
</head>
<body>
    <form action="/libros/actualizar" method="POST" class="book-form">

        <h2>Editar Libro</h2>
        <p>Edita un libro del catálogo de la biblioteca.</p>

        <div class="input-group">
            <label for="titulo">Título</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                maxlength="200"
                placeholder="Ej. Cien años de soledad"
                value="{{libro['titulo']}}"
                required>
        </div>

        <div class="input-group">
            <label for="autor">Autor</label>
            <input
                type="text"
                id="autor"
                name="autor"
                maxlength="100"
                placeholder="Ej. Gabriel García Márquez"
                value="{{libro['autor']}}"
                required>
        </div>

        <div class="input-group">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" 
                    required>
                
                <option value="Novela"
                    {% if libro['categoria'] == 'Novela' %}selected{% endif %}>
                    Novela
                </option>

                <option value="Ciencia Ficcion"
                    {% if libro['categoria'] == 'Ciencia Ficcion' %}selected{% endif %}>
                    Ciencia Ficción
                </option>

                <option value="Historia"
                    {% if libro['categoria'] == 'Historia' %}selected{% endif %}>
                    Historia
                </option>

                <option value="Tecnologia"
                    {% if libro['categoria'] == 'Tecnologia' %}selected{% endif %}>
                    Tecnología
                </option>

                <option value="Educacion"
                    {% if libro['categoria'] == 'Educacion' %}selected{% endif %}>
                    Educación
                </option>
            </select>
        </div>

        <button type="submit" name="id_libro" value="{{libro['id_libro']}}">
            Actualizar Libro
        </button>

    </form>
</body>
</html>
